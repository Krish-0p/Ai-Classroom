services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: openlearn-postgres:17-vector
    environment:
      POSTGRES_USER: openlearn
      POSTGRES_PASSWORD: openlearn_local
      POSTGRES_DB: openlearn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - openlearn_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlearn -d openlearn"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  openlearn_data:
